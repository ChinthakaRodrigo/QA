# SonarQube configuration - run "sonar-scanner" from this folder
# (run the tests with coverage first, see README.md)

sonar.projectKey=library-system
sonar.projectName=Library Management System
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source code (frontend + backend)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.test.js,**/*.test.jsx,frontend/src/test-utils.jsx,frontend/src/setupTests.js

# Not counted in coverage: entry points that only start the app
sonar.coverage.exclusions=backend/src/server.js,frontend/src/main.jsx

# Coverage reports produced by Jest (backend) and Vitest (frontend)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
